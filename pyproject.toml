[project]
name = "frigobot"
version = "0.1.0"
description = "Telegram bot for tracking Frigo (4-player FFA Pokemon Showdown) match results"
requires-python = ">=3.12"
dependencies = [
    "fpdf2>=2.8.8",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "polars>=1.44.2",
    "python-dotenv>=1.2.3",
    "python-telegram-bot>=22.8",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "scipy>=1.18.1",
]
